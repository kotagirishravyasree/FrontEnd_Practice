<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascading</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* InStyle is having more preference,then comes Internal Style and External Style,
        but this order is ignored when !important keyword is used*/
        /* Cascading means browser/css follows top-bottom approach*/
        /* p{
            color:violet;
            font-size:18px;
        } */
    </style>
</head>
<body>
    <h1>Understanding CSS Cascade</h1>
    <p style="color:burlywood; font-size:18px;">This is para 1</p>
    <p>This is para 2</p>
    <p>This is para 3</p>
</body>
</html>
